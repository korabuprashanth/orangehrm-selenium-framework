name: UI tests and Allure report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --headless
        continue-on-error: true   # keep going so the report is still published

      - name: Get previous Allure report from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true   # fails on the first run, before gh-pages has content
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        if: always()
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p reports/allure-results/history
            cp -r gh-pages/history/. reports/allure-results/history/
          fi
          allure generate reports/allure-results -o allure-report --clean

      - name: Publish to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: false   # the generated report already includes history
